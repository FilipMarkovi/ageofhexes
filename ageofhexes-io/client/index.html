<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Search Engine Tags -->
  <title>Age of Hexes</title>
  <meta name="title" content="Age of Hexes">
  <meta name="description" content="Play Age of Hexes online! A fast-paced hexagonal strategy browser game. Capture territory, outsmart opponents, and climb the leaderboard.">
  <meta name="keywords" content="Age of Hexes, hex game, multiplayer browser game, io games, strategy game online, hexes io">
  <meta name="author" content="Age of Hexes">
  <meta name="robots" content="index, follow">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://ageofhexes.io/">

  <!-- Open Graph / Discord / Facebook Preview Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ageofhexes.io/">
  <meta property="og:title" content="Age of Hexes">
  <meta property="og:description" content="Capture territory, outsmart opponents, and rule the hex grid. Play free in your browser!">
  <meta property="og:image" content="https://ageofhexes.io/og-image.png"> <!-- 1200x630px image URL -->
  <meta property="og:site_name" content="Age of Hexes">

  <!-- Twitter/X Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://ageofhexes.io/">
  <meta name="twitter:title" content="Age of Hexes">
  <meta name="twitter:description" content="Capture territory, outsmart opponents, and rule the hex grid. Play free in your browser!">
  <meta name="twitter:image" content="https://ageofhexes.io/og-image.png">

  <!-- Favicon / Tab Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

  <!-- Apple Touch Icon (Mobile Safari shortcuts) -->
  <link rel="apple-touch-icon" href="/favicon-96x96.png">

  <!-- Open Graph / Discord / Facebook og:image -->
  <meta property="og:image" content="https://ageofhexes.io/og-image.png">
  <meta name="twitter:image" content="https://ageofhexes.io/og-image.png">

  <!-- Structured Data (Schema.org JSON-LD for Google rich game results) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Age of Hexes",
      "operatingSystem": "Web Browser",
      "applicationCategory": "GameApplication",
      "genre": "Strategy",
      "url": "https://ageofhexes.io",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>

  <style>
    body { margin: 0; background: #111; color: white; overflow: hidden; }
    canvas { display: block; }

    /* Combined Footer Container */
    #footer-info {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 200;
      white-space: nowrap;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Links inside credits matching the text color & style */
    #footer-info a {
      color: inherit;
      text-decoration: underline;
    }
    #copyright {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="footer-info">
    <div id="copyright">&copy; 2026 Age of Hexes&trade;. All rights reserved.</div>
    <div id="credits">Icons by Lorcc & Delapouite (<a href="https://game-icons.net" target="_blank" rel="noopener noreferrer">game-icons.net</a>) / CC BY 3.0</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
